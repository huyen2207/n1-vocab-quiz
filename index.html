<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1語彙クイズ - Bai1</title>
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="app-header">
    <h1>N1語彙クイズ <span class="subtitle">徹底トレーニング Bai1</span></h1>
  </header>

  <!-- スタート画面 -->
  <section id="start-screen" class="screen">
    <p class="intro">
      「徹底トレーニング 語彙N1 — Bài 1」の単語（全126語）から出題します。<br>
      4択問題を1問ずつ解いていきましょう。
    </p>

    <div class="option-group">
      <label>出題数</label>
      <div class="option-buttons" id="count-options">
        <button type="button" class="option-btn" data-count="5">5問</button>
        <button type="button" class="option-btn" data-count="10">10問</button>
        <button type="button" class="option-btn" data-count="20">20問</button>
        <button type="button" class="option-btn" data-count="all">全126問</button>
      </div>
    </div>

    <div class="option-group">
      <label>出題形式</label>
      <div class="option-buttons" id="type-options">
        <button type="button" class="option-btn" data-type="kanji-yomi">漢字→読み方</button>
        <button type="button" class="option-btn" data-type="kanji-meaning">漢字→意味</button>
        <button type="button" class="option-btn" data-type="meaning-kanji">ベトナム語→漢字</button>
        <button type="button" class="option-btn" data-type="mixed">ミックス</button>
      </div>
    </div>

    <button id="start-btn" class="primary-btn">クイズを始める</button>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz-screen" class="screen hidden">
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <p id="progress-text" class="progress-text"></p>

    <div class="question-card">
      <p id="question-label" class="question-label"></p>
      <h2 id="question-text" class="question-text"></h2>
    </div>

    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback hidden">
      <p id="feedback-result" class="feedback-result"></p>
      <p id="feedback-explain" class="feedback-explain"></p>
      <button id="next-btn" class="primary-btn">次へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="screen hidden">
    <h2>結果</h2>
    <p id="result-score" class="result-score"></p>
    <div id="result-list" class="result-list"></div>
    <button id="retry-btn" class="primary-btn">もう一度挑戦する</button>
  </section>
</div>

<script src="script.js"></script>
