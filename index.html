<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>N1語彙クイズ</title>
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="app-header">
    <h1>N1語彙クイズ <span class="subtitle">徹底トレーニング Bai1〜68</span></h1>
  </header>

  <!-- スタート画面 -->
  <section id="start-screen" class="screen">
    <p class="intro" id="intro-text">
      「徹底トレーニング 語彙N1」の単語から出題します。<br>
      4択問題を1問ずつ解いていきましょう。
    </p>
    <p id="loading-text" class="loading-text">単語データを読み込み中...</p>

    <div class="option-group hidden" id="range-group">
      <label>出題範囲</label>
      <div class="option-buttons" id="range-options"></div>
    </div>

    <div class="option-group hidden" id="count-group">
      <label>出題数</label>
      <div class="option-buttons" id="count-options">
        <button type="button" class="option-btn" data-count="5">5問</button>
        <button type="button" class="option-btn" data-count="10">10問</button>
        <button type="button" class="option-btn" data-count="20">20問</button>
        <button type="button" class="option-btn" data-count="all">全問</button>
      </div>
    </div>

    <div class="option-group hidden" id="type-group">
      <label>出題形式</label>
      <div class="option-buttons" id="type-options">
        <button type="button" class="option-btn" data-type="kanji-yomi">漢字→読み方</button>
        <button type="button" class="option-btn" data-type="kanji-meaning">漢字→意味</button>
        <button type="button" class="option-btn" data-type="meaning-kanji">ベトナム語→漢字</button>
        <button type="button" class="option-btn" data-type="mixed">ミックス</button>
      </div>
    </div>

    <button id="start-btn" class="primary-btn hidden">クイズを始める</button>

    <div id="flashcard-entry" class="flashcard-entry hidden">
      <p id="flashcard-entry-text"></p>
      <button id="flashcard-entry-btn" class="secondary-btn">苦手単語をフラッシュカードで復習する</button>
    </div>

    <div id="mastery-info" class="mastery-info hidden">
      <p id="mastery-info-text"></p>
    </div>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz-screen" class="screen hidden">
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <p id="progress-text" class="progress-text"></p>

    <div class="question-card">
      <p id="question-label" class="question-label"></p>
      <h2 id="question-text" class="question-text"></h2>
    </div>

    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback hidden">
      <p id="feedback-result" class="feedback-result"></p>
      <p id="feedback-explain" class="feedback-explain"></p>
      <button id="next-btn" class="primary-btn">次へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="screen hidden">
    <h2>結果</h2>
    <p id="result-score" class="result-score"></p>
    <div id="result-list" class="result-list"></div>
    <button id="review-mistakes-btn" class="secondary-btn hidden">今回間違えた単語をフラッシュカードで復習する</button>
    <button id="retry-btn" class="primary-btn">もう一度挑戦する</button>
  </section>

  <!-- フラッシュカード画面 -->
  <section id="flashcard-screen" class="screen hidden">
    <p id="flashcard-progress" class="progress-text"></p>

    <div id="flashcard" class="flashcard">
      <div id="flashcard-inner" class="flashcard-inner">
        <div class="flashcard-face flashcard-front">
          <p class="flashcard-label">漢字（タップしてめくる）</p>
          <h2 id="flashcard-kanji" class="flashcard-kanji"></h2>
        </div>
        <div class="flashcard-face flashcard-back">
          <p id="flashcard-yomi" class="flashcard-yomi"></p>
          <p id="flashcard-meaning" class="flashcard-meaning"></p>
          <p id="flashcard-source" class="flashcard-source"></p>
        </div>
      </div>
    </div>

    <div id="flashcard-actions" class="flashcard-actions hidden">
      <button id="fc-again-btn" class="fc-btn fc-again">まだ覚えてない</button>
      <button id="fc-known-btn" class="fc-btn fc-known">覚えた！</button>
    </div>

    <div id="flashcard-complete" class="hidden">
      <p id="flashcard-complete-text" class="result-score"></p>
    </div>

    <button id="fc-exit-btn" class="primary-btn fc-exit">トップに戻る</button>
  </section>
</div>

<script src="script.js"></script>
